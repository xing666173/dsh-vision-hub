name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c448adde47 # v4.2.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install tool-vision dependencies
        working-directory: tool-vision
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run tool-vision tests
        working-directory: tool-vision
        run: npm test
