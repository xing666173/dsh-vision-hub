name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run repo manifest / structure tests
        run: node --test tests/manifest.test.js
      - name: Install tool-vision dependencies
        working-directory: tool-vision
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run tool-vision tests (21 cases)
        working-directory: tool-vision
        run: npm test
      - name: Run bridge-preview regex tests
        working-directory: bridge-preview
        run: node test-regex.mjs
      - name: Run bridge-preview route tests
        working-directory: bridge-preview
        run: node test-route.mjs
